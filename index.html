<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Custodia Familiar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' x='0.1em' font-size='80'%3EF👨‍👩‍👧‍👦%3C/text%3E%3C/svg%3E">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', system-ui, sans-serif;
            background: linear-gradient(180deg, #f5f5f7 0%, #e8e8ed 100%);
            background-attachment: fixed;
            color: #1d1d1f;
            overscroll-behavior-y: none;
            letter-spacing: -0.02em;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .hidden { display: none !important; }

        /* --- LOGIN --- */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.03em;
        }

        .login-subtitle {
            color: #86868b;
            text-align: center;
            margin-bottom: 28px;
            font-size: 14px;
            font-weight: 400;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
            padding-left: 4px;
        }

        .form-group input,
        .form-group select {
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            color: #1d1d1f;
            transition: all 0.2s ease;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .btn-primary {
            background: #007aff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-primary:active {
            transform: scale(0.97);
            background: #0051d5;
        }

        /* --- APP CONTAINER --- */
        .app-container {
            min-height: 100vh;
            padding-bottom: 80px;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.06);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
            flex: 1;
            text-align: center;
            letter-spacing: -0.03em;
        }

        .header-btn {
            background: #f5f5f7;
            border: none;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: #007aff;
            min-width: 40px;
            min-height: 40px;
        }

        .header-btn:active {
            transform: scale(0.95);
            background: #e8e8ed;
        }

        /* --- CALENDAR --- */
        .calendar-container {
            padding: 16px;
            max-width: 100%;
        }

        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
            padding: 0 4px;
        }

        .month-btn {
            background: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: #007aff;
            min-width: 44px;
            min-height: 44px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .month-btn:active {
            transform: scale(0.95);
            background: #f5f5f7;
        }

        .month-display {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            text-align: center;
            flex: 1;
            letter-spacing: -0.02em;
        }

        .calendar-grid {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            padding: 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: white;
            color: #1d1d1f;
            border: 1px solid transparent;
            min-height: 44px;
        }

        .day-cell.inactive {
            color: #d2d2d7;
        }

        .day-cell.today {
            background: #f5f5f7;
            border-color: #007aff;
            color: #007aff;
            font-weight: 600;
        }

        .day-cell.parent-a {
            background: linear-gradient(135deg, #34c759, #30d158);
            color: white;
            font-weight: 600;
        }

        .day-cell.parent-b {
            background: linear-gradient(135deg, #ff9500, #ff8c00);
            color: white;
            font-weight: 600;
        }

        .day-cell:active {
            transform: scale(0.92);
        }

        /* --- LEGEND --- */
        .legend {
            display: flex;
            gap: 12px;
            margin: 16px 16px 0;
            padding: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }

        .legend-color.a {
            background: linear-gradient(135deg, #34c759, #30d158);
        }

        .legend-color.b {
            background: linear-gradient(135deg, #ff9500, #ff8c00);
        }

        /* --- MODALS --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            padding: 0;
        }

        .modal-content {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(0);
            animation: slideUp 0.3s ease-out;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f5f5f7;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.02em;
        }

        .close-btn {
            background: #f5f5f7;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #86868b;
            transition: all 0.2s ease;
        }

        .close-btn:active {
            transform: scale(0.9);
            background: #e8e8ed;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- BUTTONS --- */
        .btn {
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
            min-height: 48px;
        }

        .btn-parent-a {
            background: #34c759;
            color: white;
        }

        .btn-parent-a:active {
            transform: scale(0.97);
            background: #2fb350;
        }

        .btn-parent-b {
            background: #ff9500;
            color: white;
        }

        .btn-parent-b:active {
            transform: scale(0.97);
            background: #f08800;
        }

        .btn-neutral {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .btn-neutral:active {
            transform: scale(0.97);
            background: #e8e8ed;
        }

        .btn-danger {
            background: #ff3b30;
            color: white;
        }

        .btn-danger:active {
            transform: scale(0.97);
            background: #e6342a;
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(0, 0, 0, 0.06);
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 100;
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.04);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: #86868b;
            transition: all 0.2s ease;
            border-radius: 12px;
            flex: 1;
            max-width: 100px;
            min-height: 56px;
        }

        .nav-btn.active {
            color: #007aff;
            background: #f5f5f7;
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* --- LISTS --- */
        .request-list,
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
        }

        .request-card,
        .activity-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .request-header,
        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
        }

        .request-info,
        .activity-info {
            flex: 1;
        }

        .request-date,
        .activity-date {
            font-size: 13px;
            color: #86868b;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .request-reason,
        .activity-title {
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 2px;
        }

        .request-from {
            font-size: 13px;
            color: #86868b;
        }

        .activity-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .type-visita { background: #e8f5e9; color: #2e7d32; }
        .type-actividad { background: #e3f2fd; color: #1565c0; }
        .type-medica { background: #fff3e0; color: #e65100; }
        .type-escolar { background: #f3e5f5; color: #6a1b9a; }

        .request-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 36px;
        }

        .btn-approve {
            background: #34c759;
            color: white;
        }

        .btn-approve:active {
            transform: scale(0.95);
            background: #2fb350;
        }

        .btn-reject {
            background: #f5f5f7;
            color: #ff3b30;
        }

        .btn-reject:active {
            transform: scale(0.95);
            background: #e8e8ed;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #86868b;
        }

        .empty-state-icon {
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 15px;
            font-weight: 500;
        }

        /* --- CONFIG --- */
        .config-container {
            padding: 16px;
            padding-bottom: 100px;
        }

        .config-section {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .config-section-title {
            font-size: 13px;
            font-weight: 700;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 0.5px solid #f5f5f7;
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-label {
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .config-value {
            font-size: 15px;
            color: #86868b;
        }

        .config-button {
            width: 100%;
            margin-top: 8px;
        }

        /* --- RESPONSIVE OPTIMIZATIONS --- */
        @media (max-width: 380px) {
            .login-card {
                padding: 24px 20px;
            }

            .calendar-grid {
                padding: 12px;
            }

            .day-cell {
                font-size: 14px;
                min-height: 40px;
            }

            .weekday {
                font-size: 10px;
            }

            .legend {
                flex-direction: column;
                gap: 8px;
            }

            .nav-btn {
                padding: 6px 8px;
                min-height: 52px;
            }

            .nav-btn span {
                font-size: 10px;
            }
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 600px;
                margin: 0 auto;
            }

            .modal-content {
                border-radius: 20px;
                max-height: 80vh;
            }

            .modal {
                align-items: center;
                padding: 20px;
            }
        }

        /* Safe area for notched devices */
        @supports (padding: max(0px)) {
            .header {
                padding-top: max(12px, env(safe-area-inset-top));
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }

            .bottom-nav {
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b8b8bd;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-wrapper">
        <div class="login-card">
            <h1 class="login-title">Custodia Familiar</h1>
            <p class="login-subtitle">Coordina la custodia familiar de forma visual</p>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="userName">Nombre</label>
                    <input type="text" id="userName" name="userName" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="userRole">Rol</label>
                    <select id="userRole" name="userRole" required>
                        <option value="">Selecciona tu rol</option>
                        <option value="a">Progenitor A</option>
                        <option value="b">Progenitor B</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="appContainer" class="app-container hidden">
        <!-- HEADER -->
        <div class="header">
            <button class="header-btn" id="backBtn" style="visibility: hidden;">
                <i data-lucide="arrow-left" width="20" height="20"></i>
            </button>
            <h1 class="header-title" id="headerTitle">Calendario</h1>
            <button class="header-btn" id="settingsBtn">
                <i data-lucide="settings" width="20" height="20"></i>
            </button>
        </div>

        <!-- CALENDAR VIEW -->
        <div id="calendarView">
            <div class="calendar-container">
                <div class="month-selector">
                    <button class="month-btn" id="prevMonth">
                        <i data-lucide="chevron-left" width="20" height="20"></i>
                    </button>
                    <div class="month-display" id="monthDisplay">Enero 2026</div>
                    <button class="month-btn" id="nextMonth">
                        <i data-lucide="chevron-right" width="20" height="20"></i>
                    </button>
                </div>
                <div class="calendar-grid">
                    <div class="weekdays">
                        <div class="weekday">Lun</div>
                        <div class="weekday">Mar</div>
                        <div class="weekday">Mié</div>
                        <div class="weekday">Jue</div>
                        <div class="weekday">Vie</div>
                        <div class="weekday">Sáb</div>
                        <div class="weekday">Dom</div>
                    </div>
                    <div class="days-grid" id="daysGrid"></div>
                </div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color a"></div>
                    <span id="legendA">Progenitor A</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color b"></div>
                    <span id="legendB">Progenitor B</span>
                </div>
            </div>
        </div>

        <!-- REQUESTS VIEW -->
        <div id="requestsView" class="hidden">
            <div class="request-list" id="requestList"></div>
        </div>

        <!-- ACTIVITIES VIEW -->
        <div id="activitiesView" class="hidden">
            <div class="activity-list" id="activityList"></div>
        </div>

        <!-- CONFIG VIEW -->
        <div id="configView" class="hidden">
            <div class="config-container">
                <div class="config-section">
                    <div class="config-section-title">Usuario</div>
                    <div class="config-item">
                        <span class="config-label">Nombre</span>
                        <span class="config-value" id="configUserName">-</span>
                    </div>
                    <div class="config-item">
                        <span class="config-label">Rol</span>
                        <span class="config-value" id="configUserRole">-</span>
                    </div>
                </div>
                <div class="config-section">
                    <div class="config-section-title">Progenitores</div>
                    <div class="config-item">
                        <span class="config-label">Progenitor A</span>
                        <span class="config-value" id="configParentA">-</span>
                    </div>
                    <div class="config-item">
                        <span class="config-label">Progenitor B</span>
                        <span class="config-value" id="configParentB">-</span>
                    </div>
                    <button class="btn btn-neutral config-button" id="editNamesBtn">
                        <i data-lucide="edit-2" width="18" height="18"></i>
                        Editar nombres
                    </button>
                </div>
                <div class="config-section">
                    <div class="config-section-title">Datos</div>
                    <button class="btn btn-neutral config-button" id="exportBtn">
                        <i data-lucide="download" width="18" height="18"></i>
                        Exportar datos
                    </button>
                    <button class="btn btn-neutral config-button" id="importBtn">
                        <i data-lucide="upload" width="18" height="18"></i>
                        Importar datos
                    </button>
                    <input type="file" id="importFile" accept=".json" style="display: none;">
                </div>
                <div class="config-section">
                    <button class="btn btn-danger config-button" id="logoutBtn">
                        <i data-lucide="log-out" width="18" height="18"></i>
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <button class="nav-btn active" id="navCalendar">
                <i data-lucide="calendar" width="24" height="24"></i>
                <span>Calendario</span>
            </button>
            <button class="nav-btn" id="navRequests">
                <i data-lucide="inbox" width="24" height="24"></i>
                <span>Solicitudes</span>
            </button>
            <button class="nav-btn" id="navActivities">
                <i data-lucide="list" width="24" height="24"></i>
                <span>Actividades</span>
            </button>
        </div>
    </div>

    <!-- DAY MODAL -->
    <div id="dayModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="dayModalTitle">1 de Enero</h2>
                <button class="close-btn" id="closeDayModal">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <button class="btn btn-parent-a" id="assignParentA">
                    <i data-lucide="user" width="20" height="20"></i>
                    Asignar a <span id="nameA">Progenitor A</span>
                </button>
                <button class="btn btn-parent-b" id="assignParentB">
                    <i data-lucide="user" width="20" height="20"></i>
                    Asignar a <span id="nameB">Progenitor B</span>
                </button>
                <button class="btn btn-neutral" id="requestChange">
                    <i data-lucide="send" width="20" height="20"></i>
                    Solicitar cambio
                </button>
                <button class="btn btn-neutral" id="addActivity">
                    <i data-lucide="plus" width="20" height="20"></i>
                    Añadir actividad
                </button>
            </div>
        </div>
    </div>

    <!-- REQUEST CHANGE MODAL -->
    <div id="requestModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Solicitar cambio</h2>
                <button class="close-btn" id="closeRequestModal">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Motivo</label>
                    <input type="text" id="requestReason" placeholder="Ejemplo: Viaje de trabajo">
                </div>
                <button class="btn btn-primary" id="submitRequest">
                    <i data-lucide="send" width="20" height="20"></i>
                    Enviar solicitud
                </button>
            </div>
        </div>
    </div>

    <!-- ACTIVITY MODAL -->
    <div id="activityModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Nueva actividad</h2>
                <button class="close-btn" id="closeActivityModal">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="activityTitle" placeholder="Ejemplo: Partido de fútbol">
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="activityType">
                        <option value="visita">Visita</option>
                        <option value="actividad">Actividad</option>
                        <option value="medica">Médica</option>
                        <option value="escolar">Escolar</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="submitActivity">
                    <i data-lucide="plus" width="20" height="20"></i>
                    Añadir actividad
                </button>
            </div>
        </div>
    </div>

    <!-- EDIT NAMES MODAL -->
    <div id="editNamesModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Editar nombres</h2>
                <button class="close-btn" id="closeEditNamesModal">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nombre Progenitor A</label>
                    <input type="text" id="editNameA" placeholder="Nombre del progenitor A">
                </div>
                <div class="form-group">
                    <label>Nombre Progenitor B</label>
                    <input type="text" id="editNameB" placeholder="Nombre del progenitor B">
                </div>
                <button class="btn btn-primary" id="saveNames">
                    <i data-lucide="save" width="20" height="20"></i>
                    Guardar cambios
                </button>
            </div>
        </div>
    </div>

    <script>
        // App State
        let appState = {
            user: { name: '', role: '' },
            parentNames: { a: 'Progenitor A', b: 'Progenitor B' },
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            calendar: {},
            requests: [],
            activities: [],
            selectedDate: null
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            lucide.createIcons();
            setupEventListeners();

            if (appState.user.name) {
                showApp();
            }
        });

        // Event Listeners
        function setupEventListeners() {
            // Login
            document.getElementById('loginForm').addEventListener('submit', handleLogin);

            // Navigation
            document.getElementById('navCalendar').addEventListener('click', () => showView('calendar'));
            document.getElementById('navRequests').addEventListener('click', () => showView('requests'));
            document.getElementById('navActivities').addEventListener('click', () => showView('activities'));
            document.getElementById('settingsBtn').addEventListener('click', () => showView('config'));

            // Calendar
            document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
            document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));

            // Modals
            document.getElementById('closeDayModal').addEventListener('click', () => closeModal('dayModal'));
            document.getElementById('closeRequestModal').addEventListener('click', () => closeModal('requestModal'));
            document.getElementById('closeActivityModal').addEventListener('click', () => closeModal('activityModal'));
            document.getElementById('closeEditNamesModal').addEventListener('click', () => closeModal('editNamesModal'));

            // Day actions
            document.getElementById('assignParentA').addEventListener('click', () => assignDay('a'));
            document.getElementById('assignParentB').addEventListener('click', () => assignDay('b'));
            document.getElementById('requestChange').addEventListener('click', () => showRequestModal());
            document.getElementById('addActivity').addEventListener('click', () => showActivityModal());

            // Submit actions
            document.getElementById('submitRequest').addEventListener('click', submitRequest);
            document.getElementById('submitActivity').addEventListener('click', submitActivity);

            // Config
            document.getElementById('editNamesBtn').addEventListener('click', () => openModal('editNamesModal'));
            document.getElementById('saveNames').addEventListener('click', saveNames);
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
            document.getElementById('importFile').addEventListener('change', importData);
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // Close modal on background click
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeModal(modal.id);
                    }
                });
            });
        }

        // Login
        function handleLogin(e) {
            e.preventDefault();
            appState.user.name = document.getElementById('userName').value;
            appState.user.role = document.getElementById('userRole').value;
            saveState();
            showApp();
        }

        function showApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            updateParentNames();
            renderCalendar();
            updateConfigView();
            lucide.createIcons();
        }

        // Views
        function showView(view) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById('calendarView').classList.add('hidden');
            document.getElementById('requestsView').classList.add('hidden');
            document.getElementById('activitiesView').classList.add('hidden');
            document.getElementById('configView').classList.add('hidden');

            switch(view) {
                case 'calendar':
                    document.getElementById('calendarView').classList.remove('hidden');
                    document.getElementById('navCalendar').classList.add('active');
                    document.getElementById('headerTitle').textContent = 'Calendario';
                    renderCalendar();
                    break;
                case 'requests':
                    document.getElementById('requestsView').classList.remove('hidden');
                    document.getElementById('navRequests').classList.add('active');
                    document.getElementById('headerTitle').textContent = 'Solicitudes';
                    renderRequests();
                    break;
                case 'activities':
                    document.getElementById('activitiesView').classList.remove('hidden');
                    document.getElementById('navActivities').classList.add('active');
                    document.getElementById('headerTitle').textContent = 'Actividades';
                    renderActivities();
                    break;
                case 'config':
                    document.getElementById('configView').classList.remove('hidden');
                    document.getElementById('headerTitle').textContent = 'Configuración';
                    updateConfigView();
                    break;
            }

            lucide.createIcons();
        }

        // Calendar
        function renderCalendar() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            const firstDay = new Date(appState.currentYear, appState.currentMonth, 1);
            const lastDay = new Date(appState.currentYear, appState.currentMonth + 1, 0);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            // Update month display
            const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            document.getElementById('monthDisplay').textContent = 
                `${months[appState.currentMonth]} ${appState.currentYear}`;

            // Previous month days
            const prevLastDay = new Date(appState.currentYear, appState.currentMonth, 0).getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'day-cell inactive';
                day.textContent = prevLastDay - i;
                grid.appendChild(day);
            }

            // Current month days
            const today = new Date();
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const day = document.createElement('div');
                day.className = 'day-cell';
                day.textContent = i;

                const dateKey = `${appState.currentYear}-${appState.currentMonth + 1}-${i}`;
                const assignment = appState.calendar[dateKey];

                if (assignment) {
                    day.classList.add(`parent-${assignment}`);
                }

                if (today.getDate() === i && 
                    today.getMonth() === appState.currentMonth && 
                    today.getFullYear() === appState.currentYear) {
                    day.classList.add('today');
                }

                day.addEventListener('click', () => openDayModal(i));
                grid.appendChild(day);
            }

            // Next month days
            const remainingCells = 42 - grid.children.length;
            for (let i = 1; i <= remainingCells; i++) {
                const day = document.createElement('div');
                day.className = 'day-cell inactive';
                day.textContent = i;
                grid.appendChild(day);
            }
        }

        function changeMonth(delta) {
            appState.currentMonth += delta;
            if (appState.currentMonth > 11) {
                appState.currentMonth = 0;
                appState.currentYear++;
            } else if (appState.currentMonth < 0) {
                appState.currentMonth = 11;
                appState.currentYear--;
            }
            renderCalendar();
        }

        // Day Modal
        function openDayModal(day) {
            appState.selectedDate = `${appState.currentYear}-${appState.currentMonth + 1}-${day}`;
            const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 
                          'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            document.getElementById('dayModalTitle').textContent = 
                `${day} de ${months[appState.currentMonth]}`;
            openModal('dayModal');
        }

        function assignDay(parent) {
            appState.calendar[appState.selectedDate] = parent;
            saveState();
            closeModal('dayModal');
            renderCalendar();
        }

        function showRequestModal() {
            closeModal('dayModal');
            openModal('requestModal');
        }

        function showActivityModal() {
            closeModal('dayModal');
            openModal('activityModal');
        }

        function submitRequest() {
            const reason = document.getElementById('requestReason').value;
            if (!reason) return;

            appState.requests.push({
                id: Date.now(),
                date: appState.selectedDate,
                reason: reason,
                from: appState.user.role,
                status: 'pending'
            });

            document.getElementById('requestReason').value = '';
            saveState();
            closeModal('requestModal');
            alert('Solicitud enviada correctamente');
        }

        function submitActivity() {
            const title = document.getElementById('activityTitle').value;
            const type = document.getElementById('activityType').value;
            if (!title) return;

            appState.activities.push({
                id: Date.now(),
                date: appState.selectedDate,
                title: title,
                type: type
            });

            document.getElementById('activityTitle').value = '';
            saveState();
            closeModal('activityModal');
            alert('Actividad añadida correctamente');
        }

        // Requests
        function renderRequests() {
            const list = document.getElementById('requestList');
            const pendingRequests = appState.requests.filter(r => r.status === 'pending');

            if (pendingRequests.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i data-lucide="inbox" width="48" height="48"></i>
                        </div>
                        <div class="empty-state-text">No hay solicitudes pendientes</div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.innerHTML = pendingRequests.map(req => {
                const [year, month, day] = req.date.split('-');
                const dateStr = `${day}/${month}/${year}`;
                const fromRole = req.from === 'a' ? appState.parentNames.a : appState.parentNames.b;

                return `
                    <div class="request-card">
                        <div class="request-header">
                            <div class="request-info">
                                <div class="request-date">${dateStr}</div>
                                <div class="request-reason">${req.reason}</div>
                                <div class="request-from">De: ${fromRole}</div>
                            </div>
                        </div>
                        <div class="request-actions">
                            <button class="btn-small btn-approve" onclick="handleRequest(${req.id}, 'approved')">
                                Aprobar
                            </button>
                            <button class="btn-small btn-reject" onclick="handleRequest(${req.id}, 'rejected')">
                                Rechazar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function handleRequest(id, status) {
            const request = appState.requests.find(r => r.id === id);
            if (!request) return;

            request.status = status;

            if (status === 'approved') {
                const targetParent = request.from === 'a' ? 'b' : 'a';
                appState.calendar[request.date] = targetParent;
            }

            saveState();
            renderRequests();
            renderCalendar();
            alert(status === 'approved' ? 'Solicitud aprobada' : 'Solicitud rechazada');
        }

        // Activities
        function renderActivities() {
            const list = document.getElementById('activityList');

            if (appState.activities.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i data-lucide="calendar" width="48" height="48"></i>
                        </div>
                        <div class="empty-state-text">No hay actividades registradas</div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.innerHTML = appState.activities.map(act => {
                const [year, month, day] = act.date.split('-');
                const dateStr = `${day}/${month}/${year}`;

                return `
                    <div class="activity-card">
                        <div class="activity-header">
                            <div class="activity-info">
                                <div class="activity-date">${dateStr}</div>
                                <div class="activity-title">${act.title}</div>
                            </div>
                            <span class="activity-type type-${act.type}">${act.type}</span>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Config
        function updateConfigView() {
            document.getElementById('configUserName').textContent = appState.user.name;
            document.getElementById('configUserRole').textContent = 
                appState.user.role === 'a' ? appState.parentNames.a : appState.parentNames.b;
            document.getElementById('configParentA').textContent = appState.parentNames.a;
            document.getElementById('configParentB').textContent = appState.parentNames.b;
        }

        function saveNames() {
            const nameA = document.getElementById('editNameA').value;
            const nameB = document.getElementById('editNameB').value;

            if (nameA) appState.parentNames.a = nameA;
            if (nameB) appState.parentNames.b = nameB;

            saveState();
            updateParentNames();
            updateConfigView();
            closeModal('editNamesModal');
            alert('Nombres actualizados correctamente');
        }

        function updateParentNames() {
            document.getElementById('legendA').textContent = appState.parentNames.a;
            document.getElementById('legendB').textContent = appState.parentNames.b;
            document.getElementById('nameA').textContent = appState.parentNames.a;
            document.getElementById('nameB').textContent = appState.parentNames.b;
            document.getElementById('editNameA').value = appState.parentNames.a;
            document.getElementById('editNameB').value = appState.parentNames.b;
        }

        function exportData() {
            const dataStr = JSON.stringify(appState, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `custodia-familiar-${Date.now()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    appState = JSON.parse(event.target.result);
                    saveState();
                    showApp();
                    alert('Datos importados correctamente');
                } catch (error) {
                    alert('Error al importar datos');
                }
            };
            reader.readAsText(file);
        }

        function logout() {
            if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
                appState = {
                    user: { name: '', role: '' },
                    parentNames: { a: 'Progenitor A', b: 'Progenitor B' },
                    currentMonth: new Date().getMonth(),
                    currentYear: new Date().getFullYear(),
                    calendar: {},
                    requests: [],
                    activities: [],
                    selectedDate: null
                };
                saveState();
                location.reload();
            }
        }

        // Modal helpers
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Storage
        function saveState() {
            localStorage.setItem('custodiaFamiliar', JSON.stringify(appState));
        }

        function loadState() {
            const saved = localStorage.getItem('custodiaFamiliar');
            if (saved) {
                appState = JSON.parse(saved);
            }
        }
    </script>

</body>
</html>
