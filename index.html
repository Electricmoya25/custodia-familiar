<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Custodia Familiar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --mother-color: #fce7f3;
      --father-color: #dbeafe;
      --accent-color: #7c3aed;
      --accent-soft: #ede9fe;
      --text-main: #111827;
      --text-muted: #6b7280;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --shadow-soft: 0 16px 40px rgba(15,23,42,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }

    .hidden { display: none; }

    /* =====================================================
       SPRITE GLOBAL MADRE / PADRE
       ===================================================== */

    .sprite {
      background-image: url("assets/sprite-madre-padre.png");
      background-size: 200% 100%;
      background-repeat: no-repeat;
      display: inline-block;
    }

    .sprite.madre { background-position: 0% 0%; }
    .sprite.padre { background-position: 100% 0%; }

    /* Tamaños */
    .sprite-xs { width: 18px; height: 18px; }
    .sprite-sm { width: 28px; height: 28px; }
    .sprite-md { width: 40px; height: 40px; }
    .sprite-lg { width: 48px; height: 48px; }

    /* =====================================================
       LOGIN
       ===================================================== */

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ede9fe, #f3f4fb);
      padding: 20px;
    }

    .login-card {
      background: #fff;
      border-radius: 28px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(15,23,42,.18);
      text-align: center;
    }

    .login-title {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: .95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .login-field {
      margin-bottom: 14px;
      text-align: left;
    }

    .login-field label {
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    .login-field input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    /* =====================================================
       TOPBAR
       ===================================================== */

    .topbar {
      background: #fff;
      border-radius: 24px;
      padding: 14px 18px;
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-name {
      font-weight: 700;
      font-size: 1.2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    /* =====================================================
       CALENDARIO
       ===================================================== */

    .calendar-wrapper {
      background: #fff;
      border-radius: 28px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      margin: 16px;
    }

    table.month-table {
      width: 100%;
      border-spacing: 4px;
      border-collapse: separate;
    }

    .month-table td {
      height: 90px;
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .day-mother { background: var(--mother-color); }
    .day-father { background: var(--father-color); }

    .day-number {
      position: absolute;
      top: 6px;
      left: 8px;
      font-weight: 700;
      z-index: 2;
    }

    .owner-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: .14;
      z-index: 1;
    }

    .day-cell.is-today .owner-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.2));
    }

    /* =====================================================
       MODAL
       ===================================================== */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 9999;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    /* =====================================================
       LEYENDA
       ===================================================== */

    .legend {
      display: flex;
      gap: 20px;
      font-weight: 600;
      margin-bottom: 10px;
      align-items: center;
    }

  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login-view" class="login-wrapper">
  <div class="login-card">
    <div class="login-title">
      <span class="sprite madre sprite-md"></span>
      Custodia Familiar
      <span class="sprite padre sprite-md"></span>
    </div>
    <div class="login-subtitle">Acceso seguro</div>

    <div class="login-field">
      <label>Correo</label>
      <input type="email">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password">
    </div>
    <button class="login-btn">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app-root" class="hidden">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="sprite madre sprite-sm"></span>
      <span class="sprite padre sprite-sm"></span>
      <span class="app-name">Custodia Familiar</span>
    </div>
    <div class="user-info">
      <span class="sprite madre sprite-xs"></span>
      Usuario
    </div>
  </header>

  <!-- CALENDARIO -->
  <section class="calendar-wrapper">
    <div class="legend">
      <span><span class="sprite madre sprite-xs"></span> Madre</span>
      <span><span class="sprite padre sprite-xs"></span> Padre</span>
    </div>

    <table class="month-table">
      <tr>
        <td class="day-cell day-mother is-today">
          <span class="day-number">1</span>
          <span class="sprite madre sprite-lg owner-icon"></span>
        </td>
        <td class="day-cell day-father">
          <span class="day-number">2</span>
          <span class="sprite padre sprite-lg owner-icon"></span>
        </td>
      </tr>
    </table>
  </section>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="day-modal">
  <div class="modal-card">
    <div class="modal-header">
      <strong>Detalle del día</strong>
      <span class="sprite madre sprite-sm"></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="sprite madre sprite-md"></span>
      <strong>Madre</strong>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();
</script>

</body>
</html>
