<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Custodia Familiar Alberto - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Fonts & Icons -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' x='0.1em' font-size='80'%3E%F0%9F%91%A8%E2%80%8D%F0%9F%91%A9%E2%80%8D%F0%9F%91%A7%E2%80%8D%F0%9F%91%A6%3C/text%3E%3C/svg%3E">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --primary: #6366f1;
            --bg-app: #f8f9fc;
            --mom-gradient: linear-gradient(135deg, #fff0f6 0%, #ffe3e8 100%);
            --mom-accent: #db2777;
            --dad-gradient: linear-gradient(135deg, #f0f7ff 0%, #dbeafe 100%);
            --dad-accent: #2563eb;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius-card: 24px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-app);
            -webkit-tap-highlight-color: transparent;
        }

        .day-card {
            aspect-ratio: 4/5;
            transition: all 0.2s ease;
        }
        .day-card:active { transform: scale(0.95); }
        
        .is-mom { background: var(--mom-gradient); border: 2px solid #fbcfe8; }
        .is-dad { background: var(--dad-gradient); border: 2px solid #bfdbfe; }
        .is-today { box-shadow: 0 0 0 3px var(--primary) !important; }

        .event-chip {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .request-item.needs-action {
            border: 2px solid var(--primary);
            animation: subtlePulse 2s infinite;
        }
        @keyframes subtlePulse {
            0% { background: #fff; }
            50% { background: #eef2ff; }
            100% { background: #fff; }
        }
    </style>
</head>
<body class="min-h-screen">

<!-- VISTA DE CARGA / LOGIN -->
<div id="auth-screen" class="fixed inset-0 z-[5000] bg-white flex items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
        <div class="text-6xl mb-6">👨‍👩‍👧‍👦</div>
        <h1 class="text-2xl font-extrabold mb-2">Custodia Familiar</h1>
        <p class="text-gray-500 mb-8">Iniciando sesión segura...</p>
        <div id="login-container" class="hidden space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-gray-100 rounded-2xl border-none focus:ring-2 focus:ring-indigo-500 outline-none">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-4 bg-gray-100 rounded-2xl border-none focus:ring-2 focus:ring-indigo-500 outline-none">
            <button id="login-btn" class="w-full py-4 bg-gray-900 text-white font-bold rounded-2xl hover:bg-black transition-colors">Entrar</button>
            <p id="auth-error" class="text-red-500 text-sm font-medium"></p>
        </div>
        <div id="auth-loader" class="flex justify-center">
            <div class="loader"></div>
        </div>
    </div>
</div>

<div id="app-content" class="hidden opacity-0 transition-opacity duration-500">
    <!-- Header -->
    <header class="max-w-6xl mx-auto px-6 py-6 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white">
                <i data-lucide="calendar-heart"></i>
            </div>
            <h2 class="font-extrabold text-xl tracking-tight">Custodia Alberto</h2>
        </div>
        
        <div class="flex items-center gap-3">
            <div id="user-badge" class="px-4 py-2 rounded-full text-sm font-bold shadow-sm border"></div>
            <button id="logout-btn" class="p-2 text-red-500 bg-red-50 rounded-full hover:bg-red-100 transition-colors">
                <i data-lucide="log-out"></i>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8 pb-12">
        
        <!-- Calendario -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-[32px] p-6 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-8">
                    <button id="prev-month" class="p-3 bg-gray-50 rounded-full hover:bg-gray-100 transition-colors">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <div class="text-center">
                        <h3 id="current-month-label" class="text-2xl font-black capitalize">Mes Año</h3>
                        <select id="year-select" class="text-sm font-semibold text-gray-400 bg-transparent cursor-pointer"></select>
                    </div>
                    <button id="next-month" class="p-3 bg-gray-50 rounded-full hover:bg-gray-100 transition-colors">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>

                <div class="grid grid-cols-7 gap-2 mb-4">
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Lun</div>
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Mar</div>
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Mié</div>
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Jue</div>
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Vie</div>
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Sáb</div>
                    <div class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">Dom</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 gap-3">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="space-y-6">
            <!-- Formulario Solicitud -->
            <div class="bg-white rounded-[28px] p-6 shadow-sm border border-gray-100">
                <h4 class="font-extrabold mb-4 flex items-center gap-2">
                    <i data-lucide="git-pull-request" class="text-indigo-600"></i> Solicitar Cambio
                </h4>
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase px-2">Inicio</label>
                            <input type="date" id="req-start" class="w-full p-3 bg-gray-50 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase px-2">Fin</label>
                            <input type="date" id="req-end" class="w-full p-3 bg-gray-50 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <input type="text" id="req-reason" placeholder="Motivo o nota..." class="w-full p-3 bg-gray-50 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-indigo-500">
                    <button id="send-request-btn" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all">
                        Enviar Solicitud
                    </button>
                </div>
            </div>

            <!-- Lista Solicitudes -->
            <div class="bg-white rounded-[28px] p-6 shadow-sm border border-gray-100">
                <h4 class="font-extrabold mb-4 flex items-center gap-2">
                    <i data-lucide="list-checks" class="text-indigo-600"></i> Historial
                </h4>
                <div id="requests-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                    <p class="text-center text-gray-400 text-sm py-8">No hay solicitudes.</p>
                </div>
            </div>
        </aside>
    </main>
</div>

<!-- Modal Día -->
<div id="day-modal" class="modal-overlay fixed inset-0 z-[6000] hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-[32px] overflow-hidden shadow-2xl transform transition-all">
        <div id="modal-banner" class="p-8 relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 p-2 bg-white/20 hover:bg-white/40 rounded-full text-white transition-colors">
                <i data-lucide="x"></i>
            </button>
            <p id="modal-date-readable" class="text-white/80 font-bold uppercase tracking-widest text-xs mb-1"></p>
            <h2 id="modal-owner-title" class="text-3xl font-black text-white">Día de Mamá</h2>
        </div>
        
        <div class="p-8 space-y-6">
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase px-1 mb-2 block">Nuevo Evento</label>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="event-input" placeholder="Ej: Dentista 16:00" class="flex-1 p-3 bg-gray-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500">
                    <button id="add-event-btn" class="bg-gray-900 text-white p-3 rounded-xl hover:bg-black">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
                <div class="flex flex-wrap gap-2" id="icon-selector">
                    <button data-type="medico" class="icon-tag flex items-center gap-2 px-3 py-2 rounded-lg bg-red-50 text-red-600 border border-red-100 text-xs font-bold selected" onclick="selectType('medico', this)"><i data-lucide="stethoscope" class="w-3"></i> Médico</button>
                    <button data-type="escuela" class="icon-tag flex items-center gap-2 px-3 py-2 rounded-lg bg-orange-50 text-orange-600 border border-orange-100 text-xs font-bold" onclick="selectType('escuela', this)"><i data-lucide="backpack" class="w-3"></i> Cole</button>
                    <button data-type="deporte" class="icon-tag flex items-center gap-2 px-3 py-2 rounded-lg bg-purple-50 text-purple-600 border border-purple-100 text-xs font-bold" onclick="selectType('deporte', this)"><i data-lucide="trophy" class="w-3"></i> Deporte</button>
                    <button data-type="viaje" class="icon-tag flex items-center gap-2 px-3 py-2 rounded-lg bg-cyan-50 text-cyan-600 border border-cyan-100 text-xs font-bold" onclick="selectType('viaje', this)"><i data-lucide="palmtree" class="w-3"></i> Viaje</button>
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-[10px] font-bold text-gray-400 uppercase px-1 block">Eventos del día</label>
                <div id="modal-events-list" class="space-y-2">
                    <!-- Listado -->
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- CONFIGURACIÓN & ESTADO ---
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'custodia-alberto';

    // Emails configurados para roles
    const USER_ROLES = {
        'mama@ejemplo.com': 'madre',
        'papa@ejemplo.com': 'padre'
    };

    let state = {
        user: null,
        userRole: null,
        currentYear: new Date().getFullYear(),
        currentMonth: new Date().getMonth(),
        overrides: {},
        events: {},
        requests: [],
        selectedType: 'medico',
        selectedDateKey: null
    };

    // --- LÓGICA CALENDARIO ---
    const BASE_MONDAY = new Date(2026, 0, 5); // Referencia rotación semanal
    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    function getBaseOwner(y, m, d) {
        const date = new Date(y, m, d);
        const diff = Math.round((date - BASE_MONDAY) / (1000 * 60 * 60 * 24));
        // Alternancia cada 7 días
        return (Math.floor(diff / 7) % 2 === 0) ? "padre" : "madre";
    }

    // --- UI RENDER ---
    function render() {
        const { currentYear, currentMonth, overrides, events } = state;
        document.getElementById('current-month-label').textContent = `${monthNames[currentMonth]} ${currentYear}`;
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const offset = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

        // Celdas vacías
        for(let i=0; i < offset; i++) {
            grid.innerHTML += `<div class="p-2"></div>`;
        }

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

        for(let d=1; d <= daysInMonth; d++) {
            const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const owner = overrides[dateKey] || getBaseOwner(currentYear, currentMonth, d);
            const isToday = dateKey === todayStr;
            const dayEvents = events[dateKey] || [];

            const card = document.createElement('div');
            card.className = `day-card rounded-2xl p-3 flex flex-col justify-between cursor-pointer border shadow-sm ${owner === 'madre' ? 'is-mom' : 'is-dad'} ${isToday ? 'is-today' : ''}`;
            card.onclick = () => openDayModal(dateKey, owner);

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="font-black text-lg">${d}</span>
                    <i data-lucide="${owner === 'madre' ? 'heart' : 'shield'}" class="w-3 ${owner === 'madre' ? 'text-pink-500' : 'text-blue-500'} opacity-50"></i>
                </div>
                <div class="flex flex-wrap gap-1 mt-auto">
                    ${dayEvents.slice(0, 3).map(e => `<div class="event-chip ${getChipClass(e.type)}"></div>`).join('')}
                    ${dayEvents.length > 3 ? `<span class="text-[8px] font-bold text-gray-500">+${dayEvents.length - 3}</span>` : ''}
                </div>
            `;
            grid.appendChild(card);
        }
        lucide.createIcons();
    }

    function getChipClass(type) {
        const m = { medico: 'bg-red-500', escuela: 'bg-orange-500', deporte: 'bg-purple-500', viaje: 'bg-cyan-500' };
        return m[type] || 'bg-gray-400';
    }

    function renderRequests() {
        const container = document.getElementById('requests-list');
        container.innerHTML = '';
        
        if (state.requests.length === 0) {
            container.innerHTML = `<p class="text-center text-gray-400 text-sm py-8 italic">Sin actividad reciente.</p>`;
            return;
        }

        state.requests.forEach(req => {
            const isPending = req.status === 'pendiente';
            const isMeRequester = req.requesterUid === state.user.uid;
            const needsAction = isPending && !isMeRequester;

            const div = document.createElement('div');
            div.className = `p-4 rounded-2xl border bg-white ${needsAction ? 'needs-action' : ''} text-sm transition-all`;
            
            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="font-bold">${new Date(req.start).toLocaleDateString()} - ${new Date(req.end).toLocaleDateString()}</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase ${getStatusClass(req.status)}">${req.status}</span>
                </div>
                <p class="text-gray-500 text-xs italic mb-3">"${req.reason}"</p>
                ${needsAction ? `
                    <div class="flex gap-2">
                        <button class="flex-1 py-2 bg-green-500 text-white rounded-lg font-bold text-xs" onclick="processRequest('${req.id}', 'aprobada')">Aceptar</button>
                        <button class="flex-1 py-2 bg-red-500 text-white rounded-lg font-bold text-xs" onclick="processRequest('${req.id}', 'rechazada')">Rechazar</button>
                    </div>
                ` : `<div class="text-[10px] text-gray-400 font-bold">${isMeRequester ? 'Solicitado por ti' : 'Solicitado por el otro'}</div>`}
            `;
            container.appendChild(div);
        });
        lucide.createIcons();
    }

    function getStatusClass(s) {
        if (s === 'aprobada') return 'bg-green-100 text-green-700';
        if (s === 'rechazada') return 'bg-red-100 text-red-700';
        return 'bg-yellow-100 text-yellow-700';
    }

    // --- ACCIONES MODAL ---
    window.openDayModal = (dateKey, owner) => {
        state.selectedDateKey = dateKey;
        const modal = document.getElementById('day-modal');
        const banner = document.getElementById('modal-banner');
        
        state.selectedType = 'medico';
        document.querySelectorAll('.icon-tag').forEach(b => b.classList.remove('ring-2', 'ring-indigo-600', 'bg-indigo-100'));
        document.querySelector('[data-type="medico"]').classList.add('ring-2', 'ring-indigo-600');

        modal.classList.remove('hidden');
        banner.className = `p-8 relative ${owner === 'madre' ? 'is-mom' : 'is-dad'}`;
        document.getElementById('modal-date-readable').textContent = new Date(dateKey).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long'});
        document.getElementById('modal-owner-title').textContent = `Día de ${owner === 'madre' ? 'Mamá' : 'Papá'}`;
        
        renderModalEvents();
    };

    window.closeModal = () => document.getElementById('day-modal').classList.add('hidden');

    window.selectType = (type, el) => {
        state.selectedType = type;
        document.querySelectorAll('.icon-tag').forEach(b => b.classList.remove('ring-2', 'ring-indigo-600'));
        el.classList.add('ring-2', 'ring-indigo-600');
    };

    function renderModalEvents() {
        const list = document.getElementById('modal-events-list');
        const evts = state.events[state.selectedDateKey] || [];
        list.innerHTML = evts.length ? '' : '<p class="text-center text-gray-400 py-4 text-xs italic">No hay eventos para hoy</p>';
        
        evts.forEach(e => {
            const row = document.createElement('div');
            row.className = "flex items-center justify-between p-3 bg-gray-50 rounded-xl";
            row.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="p-2 rounded-lg ${getChipClass(e.type)} text-white">
                        <i data-lucide="${getIconFromType(e.type)}" class="w-3"></i>
                    </div>
                    <span class="font-bold text-sm">${e.text}</span>
                </div>
                <button onclick="removeEvent('${e.id}')" class="text-red-400 hover:text-red-600">
                    <i data-lucide="trash-2" class="w-4"></i>
                </button>
            `;
            list.appendChild(row);
        });
        lucide.createIcons();
    }

    function getIconFromType(t) {
        const m = { medico: 'stethoscope', escuela: 'backpack', deporte: 'trophy', viaje: 'palmtree' };
        return m[t] || 'circle';
    }

    // --- PERSISTENCIA FIRESTORE ---

    async function saveEvent() {
        const input = document.getElementById('event-input');
        if (!input.value.trim() || !state.user) return;

        const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'events');
        await addDoc(collectionRef, {
            date: state.selectedDateKey,
            text: input.value,
            type: state.selectedType,
            createdBy: state.user.uid,
            createdAt: Date.now()
        });
        input.value = '';
        renderModalEvents();
    }

    window.removeEvent = async (id) => {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'events', id);
        await deleteDoc(docRef);
        renderModalEvents();
    };

    async function sendRequest() {
        const start = document.getElementById('req-start').value;
        const end = document.getElementById('req-end').value;
        const reason = document.getElementById('req-reason').value || "Sin motivo";

        if (!start || !end) return alert("Selecciona fechas");

        const col = collection(db, 'artifacts', appId, 'public', 'data', 'requests');
        await addDoc(col, {
            start, end, reason,
            status: 'pendiente',
            requesterUid: state.user.uid,
            requesterRole: state.userRole,
            createdAt: Date.now()
        });
        
        document.getElementById('req-start').value = '';
        document.getElementById('req-end').value = '';
        document.getElementById('req-reason').value = '';
        alert("Solicitud enviada correctamente.");
    }

    window.processRequest = async (id, status) => {
        const reqRef = doc(db, 'artifacts', appId, 'public', 'data', 'requests', id);
        const reqSnap = await getDoc(reqRef);
        const reqData = reqSnap.data();

        if (status === 'aprobada') {
            const batch = writeBatch(db);
            const start = new Date(reqData.start);
            const end = new Date(reqData.end);

            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                const ovRef = doc(db, 'artifacts', appId, 'public', 'data', 'overrides', dateKey);
                batch.set(ovRef, { owner: reqData.requesterRole });
            }
            await batch.commit();
        }

        await updateDoc(reqRef, { status });
    };

    // --- AUTH & INIT ---
    async function init() {
        // Inicializar selectores
        const ys = document.getElementById('year-select');
        [2025, 2026, 2027].forEach(y => {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            if(y === state.currentYear) opt.selected = true;
            ys.appendChild(opt);
        });

        ys.onchange = (e) => { state.currentYear = parseInt(e.target.value); render(); };
        document.getElementById('prev-month').onclick = () => { state.currentMonth--; if(state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; } render(); };
        document.getElementById('next-month').onclick = () => { state.currentMonth++; if(state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; } render(); };
        document.getElementById('add-event-btn').onclick = saveEvent;
        document.getElementById('send-request-btn').onclick = sendRequest;
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Intento Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                state.user = user;
                state.userRole = USER_ROLES[user.email] || 'visitante';
                setupListeners();
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('app-content').classList.add('opacity-100');
                
                const badge = document.getElementById('user-badge');
                badge.textContent = state.userRole.toUpperCase();
                badge.className = `px-4 py-2 rounded-full text-xs font-black shadow-sm border ${state.userRole === 'madre' ? 'bg-pink-50 border-pink-200 text-pink-600' : 'bg-blue-50 border-blue-200 text-blue-600'}`;
                
                render();
            } else {
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('auth-loader').classList.add('hidden');
            }
        });

        // Formulario Login manual si no hay custom token
        document.getElementById('login-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                document.getElementById('auth-error').textContent = "Acceso denegado.";
            }
        };

        // Fallback Anónimo si se prefiere (para pruebas rápidas)
        if (typeof __initial_auth_token === 'undefined' || !__initial_auth_token) {
             // signInAnonymously(auth); // Descomentar para desarrollo sin login
        }
    }

    function setupListeners() {
        if (!state.user) return;

        // Overrides (Cambios manuales de custodia)
        const qOverrides = query(collection(db, 'artifacts', appId, 'public', 'data', 'overrides'));
        onSnapshot(qOverrides, (s) => {
            state.overrides = {};
            s.forEach(d => state.overrides[d.id] = d.data().owner);
            render();
        }, (err) => console.log("Error overrides", err));

        // Eventos
        const qEvents = query(collection(db, 'artifacts', appId, 'public', 'data', 'events'));
        onSnapshot(qEvents, (s) => {
            state.events = {};
            s.forEach(d => {
                const data = { id: d.id, ...d.data() };
                if (!state.events[data.date]) state.events[data.date] = [];
                state.events[data.date].push(data);
            });
            render();
            if (state.selectedDateKey) renderModalEvents();
        }, (err) => console.log("Error eventos", err));

        // Solicitudes
        const qReqs = query(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), limit(20));
        onSnapshot(qReqs, (s) => {
            state.requests = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
            renderRequests();
        }, (err) => console.log("Error solicitudes", err));
    }

    init();
</script>
</body>
</html>
