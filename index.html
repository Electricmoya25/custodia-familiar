<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Custodia Familiar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' x='0.1em' font-size='80'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* TIPOGRAFÍA Y COLORES MODERNOS */
    :root {
      --mother-color: #fce7f3; 
      --father-color: #e0f2fe; 
      --accent-color: #6366f1; 
      --accent-soft: #f0f1ff;
      --text-main: #1a1c1e;
      --text-muted: #44474e;
      --bg-main: #fbfcff;
      --card-bg: #ffffff;
      --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.04);
      --success: #34a853;
      --error: #ea4335;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: 'Google Sans', 'Inter', 'Roboto', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 50px;
      overscroll-behavior-y: none;
      letter-spacing: -0.01em;
    }

    .hidden { display: none !important; }

    /* ANIMACIONES */
    .calendar-grid { 
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease; 
      touch-action: pan-y;
    }
    .calendar-grid.fading { opacity: 0; transform: scale(0.99); }
    
    .day-cell { opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .day-cell.animated { opacity: 1; transform: translateY(0); }

    /* TOASTS */
    .toast-container {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 12px; pointer-events: none;
    }
    .toast {
      background: #2f3033; color: #fff; padding: 12px 24px; border-radius: 16px;
      font-size: 0.9rem; font-weight: 500; box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      opacity: 0; transform: translateY(12px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; gap: 12px;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }

    /* LOGIN */
    .login-wrapper {
      min-height: 100vh; display:flex;
      align-items:center; justify-content:center;
      padding:24px; background: #f0f4f8;
    }
    .login-card {
      background:#fff;
      max-width:400px; width:100%; border-radius:32px;
      box-shadow:0 12px 32px rgba(0,0,0,0.05); padding:48px 32px;
    }
    .login-title {
      font-size:1.75rem;
      font-weight:700; margin-bottom:12px;
      color:var(--text-main);
      text-align: center;
    }
    .login-subtitle { font-size:1rem; color:var(--text-muted); margin-bottom:32px; text-align: center; }
    .login-field { margin-bottom:20px; }
    .login-field label { font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:8px; display:block; padding-left:4px; }
    .login-field input {
      width:100%; padding:16px; font-size:1rem; border-radius:16px;
      border:1.5px solid #e1e3e8; background: #fbfcff;
      transition: all 0.2s ease;
    }
    .login-field input:focus { outline:none; border-color:var(--accent-color); background: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    .login-btn {
      margin-top:24px; width:100%; padding:18px; font-size:1.1rem;
      font-weight:600; border-radius:20px; background:var(--accent-color);
      color:white; border:none; cursor:pointer;
      transition: opacity 0.2s;
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .secondary-btn {
      background: transparent; border: none; color: var(--accent-color);
      font-weight: 600; font-size: 0.9rem; cursor: pointer;
      margin-top: 16px; width: 100%; text-align: center;
    }
    .secondary-btn:hover { text-decoration: underline; }

    /* TOPBAR */
    .topbar {
      padding: 16px 20px; border-radius: 24px;
      background: #fff; border: 1px solid #f0f2f5;
      box-shadow: var(--shadow-soft); margin: 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-icon { width:44px; height:44px; font-size:24px; border-radius:14px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }
    .app-name { font-size:1.25rem; font-weight:700; color: var(--text-main); }

    /* CALENDARIO */
    .calendar-wrapper { background:var(--card-bg); border-radius:32px; padding:20px; box-shadow:var(--shadow-soft); }
    .calendar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .calendar-title { font-size:1.6rem; font-weight:800; color: var(--text-main); }
    .nav-arrow { width:40px; height:40px; border-radius:50%; border:none; background:#f0f2f5; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 0.2s; }
    .nav-arrow:hover { background:#e4e6e9; }

    /* ESTILOS DE CELDA */
    .month-table td { 
      height: 100px;
      position: relative; 
      border-radius: 20px; 
      vertical-align: top; 
      overflow: hidden; 
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
    }

    .day-mother { background-color: var(--mother-color) !important; }
    .day-father { background-color: var(--father-color) !important; }
    
    .day-cell:hover { transform: scale(0.97); }
    .day-cell.is-today { border-color: var(--accent-color); z-index: 10; }

    .day-number { 
      position: absolute; top: 8px; left: 10px; 
      font-size: 1rem; font-weight: 700; color: #1f2937; z-index: 2; 
    }
    
    .owner-icon-img {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 54px; height: 54px; opacity: 0.12; pointer-events: none; z-index: 1;
      object-fit: contain; background: none !important; border: none !important;
      transition: opacity 0.3s ease;
    }

    .is-today .owner-icon-img { opacity: 0.7 !important; transform: translate(-50%, -50%) scale(1.05); }
    .day-overridden::after { content:"⇄"; position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:0.9rem; color:var(--accent-color); font-weight:bold; z-index: 3; }

    /* PEGATINAS */
    .event-marker {
      position: absolute;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 5;
      border: 2px solid white;
    }
    
    .pos-0 { top: 8px; right: 8px; }
    .pos-1 { bottom: 8px; left: 8px; }
    .pos-2 { bottom: 8px; right: 8px; }

    @media (max-width: 768px) {
      .month-table td { height: 75px !important; border-radius: 16px; }
      .owner-icon-img { width: 40px; height: 40px; }
      .topbar { margin: 12px; border-radius: 20px; }
    }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    .modal-card {
      background: #fff; width: 92%; max-width: 420px;
      border-radius: 32px; padding: 28px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.12);
    }
    .modal-title { font-size: 1.4rem; font-weight: 800; }
    .primary-btn { 
      padding: 16px; border-radius: 18px; background: var(--accent-color); 
      font-weight: 700; letter-spacing: 0.02em; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    /* REQUESTS STYLING */
    .requests-list { max-height: 300px; overflow-y: auto; padding-top: 8px; }
    .request-item { 
      background: #f8f9fc; border-radius: 16px; padding: 16px; margin-bottom: 12px; 
      border: 1px solid #eee; font-size: 0.85rem; 
    }
    .req-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-action { flex: 1; padding: 10px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: opacity 0.2s; }
    .btn-accept { background: #dcfce7; color: #166534; }
    .btn-reject { background: #fee2e2; color: #b91c1c; }
    .req-wait { font-size: 0.7rem; color: #9ca3af; font-style: italic; margin-top: 8px; }
  </style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<!-- MODAL PARA AÑADIR NOTAS -->
<div class="modal-overlay" id="day-modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modal-date-title">Detalles</div>
      <button class="close-modal" onclick="closeModal()">×</button>
    </div>
    
    <div style="margin-bottom: 24px; padding: 16px; background: #f8f9fc; border-radius: 20px; display: flex; align-items: center; gap: 12px;">
      <img id="modal-custody-img" src="" style="width: 44px; height: 44px; object-fit: contain; background: none;">
      <div>
        <div style="font-size: 0.7rem; color: #6b7280; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Custodia actual</div>
        <div id="modal-custody-text" style="font-weight: 800; font-size: 1.1rem;"></div>
      </div>
    </div>

    <div style="margin-bottom: 12px; font-weight: 700; font-size: 0.95rem; color: var(--text-muted);">¿Qué hay hoy?</div>
    <input type="text" id="event-title" placeholder="Ej. Fiesta de disfraces..." style="width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid #eee; margin-bottom: 16px; font-size: 1rem;">
    
    <div class="icon-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
      <button class="icon-btn" onclick="selectIcon('medico', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="stethoscope" style="color: #ea4335;"></i></button>
      <button class="icon-btn" onclick="selectIcon('dentista', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="smile" style="color: #1a73e8;"></i></button>
      <button class="icon-btn" onclick="selectIcon('escuela', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="backpack" style="color: #f29900;"></i></button>
      <button class="icon-btn" onclick="selectIcon('deporte', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="trophy" style="color: #8e24aa;"></i></button>
      <button class="icon-btn" onclick="selectIcon('cumple', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="cake" style="color: #e37400;"></i></button>
      <button class="icon-btn" onclick="selectIcon('parque', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="tree-deciduous" style="color: #1e8e3e;"></i></button>
      <button class="icon-btn" onclick="selectIcon('general', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="star" style="color: #5f6368;"></i></button>
      <button class="icon-btn" onclick="selectIcon('vacaciones', this)" style="border: none; background: #f0f2f5; padding: 10px; border-radius: 14px; cursor: pointer;"><i data-lucide="palmtree" style="color: #00acc1;"></i></button>
    </div>

    <button onclick="saveEvent()" class="primary-btn" style="width: 100%; color: #fff; border: none; cursor: pointer; margin-top: 16px;">Guardar actividad</button>
    <div id="modal-event-list" style="margin-top: 20px; max-height: 180px; overflow-y: auto; padding-right: 4px;"></div>
  </div>
</div>

<div id="login-view" class="login-wrapper">
  <div class="login-card">
    <div class="login-title">Calendario</div>
    <p class="login-subtitle">Coordina la custodia familiar de forma visual.</p>
    <form id="login-form">
      <div class="login-field">
        <label>Correo electrónico</label>
        <input type="email" id="login-email" required placeholder="tu@email.com">
      </div>
      <div class="login-field">
        <label>Contraseña</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn" id="login-submit-btn">Entrar</button>
      <button type="button" class="secondary-btn" id="toggle-auth-mode">¿No tienes cuenta? Regístrate</button>
      <div id="login-error-msg" style="color: var(--error); font-size: 0.8rem; margin-top: 12px; text-align: center; font-weight: 600;"></div>
    </form>
  </div>
</div>

<div id="app-root" class="app hidden">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="logo-icon">🗓️</div>
      <div>
        <div class="app-name">Custodia Familiar</div>
        <div class="status-pill status-connecting" id="status-pill">
          <span class="status-dot"></span>
          <span id="status-text" style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase;">...</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <!-- Añadido el elemento user-role-label que faltaba -->
      <span id="user-role-label" style="font-size: 0.9rem; font-weight: 700; margin-right: 8px;"></span>
      <select id="year-select" class="year-select" style="border: none; font-weight: 700; background: #f0f2f5; padding: 8px 12px; border-radius: 12px;"></select>
      <button type="button" id="logout-btn" class="logout-btn" style="border: none; background: transparent; cursor: pointer; padding: 8px;"><i data-lucide="log-out" style="width: 20px; color: #6b7280;"></i></button>
    </div>
  </header>

  <div class="layout" style="max-width: 1200px; margin: 0 auto;">
    <section class="calendar-wrapper">
      <div class="calendar-header">
        <button id="prev-period" class="nav-arrow"><i data-lucide="chevron-left"></i></button>
        <div class="calendar-title" id="calendar-title"></div>
        <button id="next-period" class="nav-arrow"><i data-lucide="chevron-right"></i></button>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>

    <section class="side-panel">
      <div class="card" style="background: #fff; border-radius: 28px; padding: 24px; box-shadow: var(--shadow-soft);">

        <form id="request-form">
          <div class="field-group">
            <label style="font-size: 0.75rem;">Usuario: <span id="whoami-label" style="color:var(--accent-color); font-weight: 800;">...</span></label>
          </div>
          <div class="field-group" style="display:flex; gap:8px;">
            <input type="date" id="start-date" required style="flex:1; padding: 10px; border-radius: 12px; border: 1px solid #eee;">
            <input type="date" id="end-date" required style="flex:1; padding: 10px; border-radius: 12px; border: 1px solid #eee;">
          </div>
          <textarea id="reason" placeholder="Motivo del cambio..." required style="margin-top: 8px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; font-family: inherit; font-size: 0.9rem;"></textarea>
          <button type="submit" class="primary-btn" style="width: 100%; border: none; color: #fff; cursor: pointer; margin-top: 12px;">Enviar solicitud</button>
        </form>
      </div>
      <div class="card" id="pending-container" style="background: #fff; border-radius: 28px; padding: 24px; box-shadow: var(--shadow-soft); margin-top: 16px;">
        <h3 class="panel-title active" style="font-size: 0.9rem; font-weight: 800; display: flex; align-items: center; gap: 8px;">
          <i data-lucide="clock" style="width: 16px;"></i> Cambios pendientes
        </h3>
        <div class="requests-list" id="pending-requests"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // CONFIGURACIÓN FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyAwgk4_l0zvaCUCgm1CjqqqXjJHr5KPBjc",
    authDomain: "custodia-familiar.firebaseapp.com",
    projectId: "custodia-familiar",
    storageBucket: "custodia-familiar.firebasestorage.app",
    messagingSenderId: "1038952432258",
    appId: "1:1038952432258:web:7608d6a48d8ad8308a6a9b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth();

  const MIN_YEAR = 2025;
  const MAX_YEAR = 2027;
  const BASE_MONDAY = new Date(2026, 0, 5, 12, 0, 0); 

  let currentUser = null;
  let currentRole = null;
  let overrides = {};
  let eventsData = {};
  let pendingRequests = [];
  let selectedDateKey = null;
  let selectedIconType = 'medico';
  let listenersAttached = false;
  let isRegistering = false;

  const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const weekDayNames = ["L","M","M","J","V","S","D"];

  const ICON_MAP = {
    'medico': 'stethoscope', 'dentista': 'smile', 'escuela': 'backpack', 
    'deporte': 'trophy', 'cumple': 'cake', 'parque': 'tree-deciduous', 
    'general': 'star', 'vacaciones': 'palmtree'
  };

  function sendTelegramMessage(text) {
    const url = "https://sendtelegram-jd4jwaesba-uc.a.run.app"; 
    fetch(url, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ text }),
    }).catch(err => console.error("Error Telegram:", err));
  }

  function formatearFecha(dateStr) {
    if (!dateStr) return "";
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function showToast(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = type === 'success' ? `<i data-lucide="check-circle" style="color:#34a853"></i> ${msg}` : `<i data-lucide="alert-circle" style="color:#ea4335"></i> ${msg}`;
    container.appendChild(el);
    lucide.createIcons();
    requestAnimationFrame(() => el.classList.add('visible'));
    setTimeout(() => { el.classList.remove('visible'); setTimeout(() => el.remove(), 300); }, 4000);
  }

  function getBaseOwner(year, monthIndex, day) {
    const date = new Date(year, monthIndex, day, 12, 0, 0);
    const diffMs = date - BASE_MONDAY;
    const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
    const weekIndex = Math.floor(diffDays / 7);
    return (Math.abs(weekIndex) % 2 === 0) ? "padre" : "madre"; 
  }

  function renderCalendar() {
    const grid = document.getElementById("calendar-grid");
    const titleEl = document.getElementById("calendar-title");
    if (!grid) return;

    grid.classList.add('fading');
    setTimeout(() => {
      grid.innerHTML = "";
      titleEl.innerHTML = `${monthNames[currentMonth]} ${currentYear}`;

      const table = document.createElement("table");
      table.className = "month-table";
      table.style.width = "100%";
      table.style.borderCollapse = "separate";
      table.style.borderSpacing = "8px";

      const thead = document.createElement("thead");
      const trHead = document.createElement("tr");
      weekDayNames.forEach(d => { 
        const th = document.createElement("th"); 
        th.textContent = d; 
        th.style = "font-size: 0.75rem; color: #9ca3af; padding: 4px; font-weight: 800;";
        trHead.appendChild(th); 
      });
      thead.appendChild(trHead);
      table.appendChild(thead);

      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDayInstance = new Date(currentYear, currentMonth, 1);
      let startDay = firstDayInstance.getDay();
      startDay = (startDay === 0) ? 6 : startDay - 1;

      const tbody = document.createElement("tbody");
      let dayCounter = 1;
      let finished = false;
      const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

      while(!finished) {
        const tr = document.createElement("tr");
        for(let i = 0; i < 7; i++) {
          const td = document.createElement("td");
          if(dayCounter <= daysInMonth && (dayCounter > 1 || i >= startDay)) {
            const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(dayCounter).padStart(2, "0")}`;
            const base = getBaseOwner(currentYear, currentMonth, dayCounter);
            const override = overrides[dateKey];
            const final = override || base;

            td.className = "day-cell";
            if(final === "padre") td.classList.add("day-father");
            if(final === "madre") td.classList.add("day-mother");
            if(override) td.classList.add("day-overridden");
            if(dateKey === todayKey) td.classList.add("is-today");
            
            td.onclick = () => openDayModal(dateKey, final);

            const spanNum = document.createElement("span");
            spanNum.className = "day-number";
            spanNum.textContent = dayCounter;
            td.appendChild(spanNum);
            
            const ownerImg = document.createElement("img");
            ownerImg.className = "owner-icon-img";
            ownerImg.src = `assets/${final}.png`;
            ownerImg.onerror = function() { this.style.display='none'; }; // Fallback si no hay imagen
            td.appendChild(ownerImg);

            const dayEvents = eventsData[dateKey] || [];
            dayEvents.slice(0, 3).forEach((evt, idx) => {
              const badge = document.createElement("div");
              badge.className = `event-marker evt-${evt.type} pos-${idx}`;
              badge.innerHTML = `<i data-lucide="${ICON_MAP[evt.type]}"></i>`;
              td.appendChild(badge);
            });

            dayCounter++;
          } else {
            td.style.pointerEvents = "none";
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
        if(dayCounter > daysInMonth) finished = true;
      }
      table.appendChild(tbody);
      grid.appendChild(table);

      lucide.createIcons();
      grid.classList.remove('fading');
      grid.querySelectorAll('.day-cell').forEach((c, i) => setTimeout(() => c.classList.add('animated'), i * 8));
    }, 200);
  }

  function renderRequestsList() {
    const listEl = document.getElementById("pending-requests");
    if (!listEl) return;
    listEl.innerHTML = "";

    if (pendingRequests.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:#9ca3af; font-size:0.8rem; margin-top:20px;">Sin solicitudes pendientes</div>`;
      return;
    }

    pendingRequests.forEach(req => {
      const item = document.createElement("div");
      item.className = "request-item";
      const quien = req.requesterRole === 'madre' ? 'Madre' : 'Padre';
      const fechas = `${formatearFecha(req.startDate)} - ${formatearFecha(req.endDate)}`;
      
      let actions = "";
      if (req.requesterRole !== currentRole) {
        actions = `
          <div class="req-actions">
            <button class="btn-action btn-accept" onclick="processRequest('${req.id}', 'aceptado', '${req.requesterRole}', '${req.startDate}', '${req.endDate}')">ACEPTAR</button>
            <button class="btn-action btn-reject" onclick="processRequest('${req.id}', 'rechazado')">RECHAZAR</button>
          </div>
        `;
      } else {
        actions = `<div class="req-wait">Esperando respuesta...</div>`;
      }

      item.innerHTML = `
        <div style="font-weight:800; margin-bottom:4px; display:flex; justify-content:space-between;">
          <span>${quien}</span>
          <span style="font-size:0.7rem; color:var(--accent-color);">${fechas}</span>
        </div>
        <div style="color:var(--text-muted); font-size:0.8rem;">"${req.reason}"</div>
        ${actions}
      `;
      listEl.appendChild(item);
    });
    lucide.createIcons();
  }

  window.processRequest = async function(reqId, newStatus, reqRole, startStr, endStr) {
    try {
      const batch = db.batch();
      batch.update(db.collection("requests").doc(reqId), { status: newStatus });

      if (newStatus === 'aceptado' && startStr && endStr) {
        const start = new Date(startStr);
        const end = new Date(endStr);
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
          const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          batch.set(db.collection("overrides").doc(dateStr), { owner: reqRole });
        }
      }

      await batch.commit();
      showToast(`Solicitud ${newStatus}`);
      
      const icon = newStatus === 'aceptado' ? "✅" : "❌";
      const responder = currentRole === 'madre' ? 'Madre' : 'Padre';
      sendTelegramMessage(`${icon} Solicitud **${newStatus.toUpperCase()}** por ${responder}.`);
    } catch (e) {
      showToast("Error al procesar", "error");
    }
  };

  function openDayModal(dateKey, owner) {
    selectedDateKey = dateKey;
    const modal = document.getElementById('day-modal');
    document.getElementById('modal-date-title').textContent = dateKey.split('-').reverse().join(' / ');
    document.getElementById('modal-custody-img').src = `assets/${owner}.png`;
    document.getElementById('modal-custody-text').textContent = owner === 'madre' ? 'Madre' : 'Padre';
    document.getElementById('modal-custody-text').style.color = owner === 'madre' ? '#db2777' : '#2563eb';
    document.getElementById('event-title').value = '';
    renderModalEvents();
    modal.classList.add('open');
  }

  function closeModal() { document.getElementById('day-modal').classList.remove('open'); }

  function selectIcon(type, btn) {
    selectedIconType = type;
    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('selected'));
    if(btn) btn.classList.add('selected');
  }

  function renderModalEvents() {
    const list = document.getElementById('modal-event-list');
    list.innerHTML = '';
    const evts = eventsData[selectedDateKey] || [];
    evts.forEach(evt => {
      const item = document.createElement('div');
      item.style = "display:flex; align-items:center; justify-content:space-between; padding:12px; background:#f8f9fa; border-radius:14px; margin-bottom:8px; border:1px solid #eee;";
      item.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><i data-lucide="${ICON_MAP[evt.type]}" style="width:16px; color:#6b7280;"></i><span style="font-weight:600; font-size:0.9rem;">${evt.title}</span></div><button onclick="deleteEvent('${evt.id}')" style="border:none; background:none; color:#ea4335; cursor:pointer; font-size:1.2rem;">✖</button>`;
      list.appendChild(item);
    });
    lucide.createIcons();
  }

  async function saveEvent() {
    const title = document.getElementById('event-title').value.trim();
    if(!title) return showToast("Escribe un título", "error");
    try {
      await db.collection("events").add({ date: selectedDateKey, title, type: selectedIconType, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      showToast("Actividad guardada");
      closeModal();
    } catch(e) { showToast("Error al guardar", "error"); }
  }

  async function deleteEvent(id) {
    try { await db.collection("events").doc(id).delete(); showToast("Actividad eliminada"); renderModalEvents(); } catch(e) {}
  }

  // --- LÓGICA DE AUTENTICACIÓN CORREGIDA ---

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      
      // Lógica forzada de roles por email (Petición usuario para evitar errores)
      if (user.email === 'padre@custodia.com') {
        currentRole = 'padre';
      } else if (user.email === 'madre@custodia.com') {
        currentRole = 'madre';
      } else {
        // Fallback a base de datos si no es uno de los emails especiales
        try {
          const snap = await db.collection("users").doc(user.uid).get();
          if (snap.exists) {
            currentRole = snap.data().role || 'madre';
          } else {
            currentRole = 'madre'; // Rol por defecto
            await db.collection("users").doc(user.uid).set({
              role: currentRole,
              email: user.email,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } catch (err) {
           console.error("Error fetching role:", err);
           currentRole = 'madre'; // Default safe fallback
        }
      }

      // Actualizar UI con comprobación de seguridad
      const roleLabel = document.getElementById("user-role-label");
      if(roleLabel) roleLabel.textContent = currentRole === 'madre' ? 'Madre' : 'Padre';
      
      const whoamiLabel = document.getElementById("whoami-label");
      if(whoamiLabel) whoamiLabel.textContent = currentRole === 'madre' ? 'MADRE' : 'PADRE';
      
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("app-root").classList.remove("hidden");
      initDataListeners();

    } else {
      currentUser = null;
      currentRole = null;
      document.getElementById("login-view").classList.remove("hidden");
      document.getElementById("app-root").classList.add("hidden");
      document.getElementById("login-submit-btn").disabled = false;
      document.getElementById("login-submit-btn").textContent = isRegistering ? "Registrarse" : "Entrar";
    }
  });

  function initDataListeners() {
    if (listenersAttached) return;
    listenersAttached = true;

    db.collection("overrides").onSnapshot(snap => {
      overrides = {}; snap.forEach(doc => overrides[doc.id] = doc.data().owner);
      renderCalendar();
    }, () => {});

    db.collection("events").onSnapshot(snap => {
      eventsData = {}; snap.forEach(doc => {
        const d = doc.data(); if(!eventsData[d.date]) eventsData[d.date] = [];
        eventsData[d.date].push({ id: doc.id, ...d });
      });
      renderCalendar();
    }, () => {});

    db.collection("requests").orderBy("createdAt", "desc").onSnapshot(snap => {
      pendingRequests = [];
      snap.forEach(doc => {
        const d = doc.data();
        if (d.status === 'pendiente') pendingRequests.push({ id: doc.id, ...d });
      });
      renderRequestsList();
    }, () => {});

    document.getElementById("status-pill").className = "status-pill status-online";
    document.getElementById("status-text").textContent = "Conectado";
    lucide.createIcons();
  }

  // --- TOGGLE LOGIN / REGISTRO ---
  document.getElementById("toggle-auth-mode").addEventListener("click", () => {
    isRegistering = !isRegistering;
    const title = document.querySelector(".login-title");
    const sub = document.querySelector(".login-subtitle");
    const btn = document.getElementById("login-submit-btn");
    const toggle = document.getElementById("toggle-auth-mode");
    
    if (isRegistering) {
        title.textContent = "Crear Cuenta";
        sub.textContent = "Regístrate para comenzar.";
        btn.textContent = "Registrarse";
        toggle.textContent = "¿Ya tienes cuenta? Entra aquí";
    } else {
        title.textContent = "Calendario";
        sub.textContent = "Coordina la custodia familiar de forma visual.";
        btn.textContent = "Entrar";
        toggle.textContent = "¿No tienes cuenta? Regístrate";
    }
  });

  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const btn = document.getElementById("login-submit-btn");
    const errorMsg = document.getElementById("login-error-msg");
    const email = document.getElementById("login-email").value;
    const pass = document.getElementById("login-password").value;
    
    btn.disabled = true;
    btn.textContent = "Procesando...";
    errorMsg.textContent = "";

    const action = isRegistering 
        ? auth.createUserWithEmailAndPassword(email, pass)
        : auth.signInWithEmailAndPassword(email, pass);

    action.catch((error) => { 
      btn.disabled = false;
      btn.textContent = isRegistering ? "Registrarse" : "Entrar"; 
      
      if (error.code === 'auth/email-already-in-use') {
        errorMsg.textContent = "Este correo ya está registrado.";
      } else if (error.code === 'auth/weak-password') {
        errorMsg.textContent = "La contraseña es muy débil.";
      } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
        errorMsg.textContent = "Correo o contraseña incorrectos.";
      } else {
        errorMsg.textContent = "Error de conexión: " + error.message;
      }
    });
  });

  document.getElementById("logout-btn").onclick = () => {
    listenersAttached = false;
    auth.signOut();
  };

  document.getElementById("prev-period").onclick = () => { currentMonth--; if(currentMonth < 0){ currentMonth=11; currentYear--; } renderCalendar(); };
  document.getElementById("next-period").onclick = () => { currentMonth++; if(currentMonth > 11){ currentMonth=0; currentYear++; } renderCalendar(); };

  document.getElementById("request-form").onsubmit = async (e) => {
    e.preventDefault();
    const startDate = document.getElementById("start-date").value;
    const endDate = document.getElementById("end-date").value;
    const reason = document.getElementById("reason").value.trim();
    
    try {
      await db.collection("requests").add({
        requesterUid: currentUser.uid, requesterRole: currentRole,
        startDate, endDate, reason, status: "pendiente",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast("Solicitud enviada");
      e.target.reset();
      
      const quien = currentRole === 'madre' ? 'Madre' : 'Padre';
      sendTelegramMessage(`📢 **NUEVA SOLICITUD**\nDe: ${quien}\n📅: ${formatearFecha(startDate)} - ${formatearFecha(endDate)}\n💬: "${reason}"`);
    } catch(e) {
      showToast("Error al enviar", "error");
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    const ys = document.getElementById("year-select");
    [2025, 2026, 2027].forEach(y => {
      const o = document.createElement("option"); o.value = y; o.textContent = y;
      if(y === currentYear) o.selected = true; ys.appendChild(o);
    });
    renderCalendar();
    lucide.createIcons();
  });
</script>
</body>
</html>
